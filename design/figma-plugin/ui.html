<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; color: var(--figma-color-text, #0f172a); background: var(--figma-color-bg, #fff); padding: 20px; }
  h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { color: var(--figma-color-text-secondary, #64748b); margin: 4px 0 16px; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--figma-color-text-secondary, #64748b); margin: 14px 0 8px; }
  .theme { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--figma-color-border, #e5e7eb); border-radius: 10px; margin-bottom: 8px; cursor: pointer; }
  .theme:has(input:checked) { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,.18); }
  .sw { display: flex; }
  .sw i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--figma-color-bg, #fff); margin-left: -5px; }
  .sw i:first-child { margin-left: 0; }
  .name { font-weight: 600; }
  .tag { font-size: 10px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#4f46e5,#9333ea); padding: 1px 6px; border-radius: 99px; margin-left: 4px; }
  .desc { font-size: 11px; color: var(--figma-color-text-secondary, #64748b); }
  .opt { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; cursor: pointer; }
  input[type=checkbox] { accent-color: #4f46e5; width: 15px; height: 15px; }
  .grow { flex: 1; }
  button { width: 100%; margin-top: 16px; padding: 11px; border: 0; border-radius: 10px; font: 600 14px Inter, system-ui, sans-serif; color: #fff; background: linear-gradient(90deg,#4f46e5,#9333ea); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #status { margin-top: 12px; min-height: 36px; font-size: 12px; color: var(--figma-color-text-secondary, #64748b); }
  #status.err { color: #dc2626; }
  #status.ok { color: #059669; font-weight: 600; }
</style>

<h1>OrderHub design generator</h1>
<p class="sub">Builds the Order Management System UI (8 screens) in up to three colour themes, wired as a clickable prototype.</p>

<div class="label">Colour options</div>
<label class="theme"><input type="checkbox" value="indigo" checked>
  <span class="sw"><i style="background:#4f46e5"></i><i style="background:#9333ea"></i><i style="background:#ec4899"></i><i style="background:#1e1b4b"></i></span>
  <span class="grow"><span class="name">A · Indigo Aurora</span><span class="tag">Recommended</span><br><span class="desc">Indigo sidebar, violet gradient</span></span></label>
<label class="theme"><input type="checkbox" value="emerald" checked>
  <span class="sw"><i style="background:#059669"></i><i style="background:#0ea5e9"></i><i style="background:#f59e0b"></i><i style="background:#f2f7f5"></i></span>
  <span class="grow"><span class="name">B · Emerald Fresh</span><br><span class="desc">Light sidebar, emerald and sky</span></span></label>
<label class="theme"><input type="checkbox" value="midnight" checked>
  <span class="sw"><i style="background:#22d3ee"></i><i style="background:#8b5cf6"></i><i style="background:#0b0f1a"></i><i style="background:#121829"></i></span>
  <span class="grow"><span class="name">C · Midnight Neon</span><br><span class="desc">Dark mode, cyan and violet</span></span></label>

<div class="label">Also create</div>
<label class="opt"><input type="checkbox" id="ds" checked> Design system page (colour styles, type, components)</label>
<label class="opt"><input type="checkbox" id="dg" checked> Sitemap &amp; ERD page</label>
<label class="opt"><input type="checkbox" id="pr" checked> Clickable prototype links</label>

<button id="go">Generate design</button>
<div id="status">Takes about 10–30 seconds. Run it in a new, empty design file.</div>

<script>
  const go = document.getElementById('go');
  const status = document.getElementById('status');
  go.onclick = () => {
    const themes = [...document.querySelectorAll('.theme input:checked')].map(i => i.value);
    if (!themes.length) { status.className = 'err'; status.textContent = 'Pick at least one colour option.'; return; }
    go.disabled = true; go.textContent = 'Generating…'; status.className = '';
    parent.postMessage({ pluginMessage: { type: 'generate', themes,
      designSystem: document.getElementById('ds').checked,
      diagrams: document.getElementById('dg').checked,
      prototype: document.getElementById('pr').checked } }, '*');
  };
  onmessage = (e) => {
    const m = e.data.pluginMessage; if (!m) return;
    status.textContent = m.text;
    if (m.type === 'done') { status.className = 'ok'; go.textContent = 'Done - close this window'; go.disabled = false;
      go.onclick = () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*'); }
    if (m.type === 'error') { status.className = 'err'; go.disabled = false; go.textContent = 'Try again'; }
  };
</script>
